name: Validate Bubble Grove
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium for UI checks
        run: npx playwright install --with-deps chromium
      - name: Check language, packs, and bubble text in a browser
        run: node scripts/catalog-browser-check.mjs
      - name: Check screwdriver, split, and countdown rules in a browser
        run: node scripts/special-rules-check.mjs
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bubble-grove-browser-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save the static game build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bubble-grove-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
